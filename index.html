  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #17324d;
      --sky: #e8f7ff;
      --blue: #3578d4;
      --yellow: #ffd65a;
      --coral: #ff826d;
      --green: #3aa86f;
      --paper: #fffdf6;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: "DM Sans", sans-serif;
      color: var(--ink);
    }

    .game-shell {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      overflow: hidden;
      position: relative;
      padding: 28px 20px 40px;
      background-color: #e9f8ff;
      background-image: radial-gradient(#b5e3f7 1.5px, transparent 1.5px);
      background-size: 22px 22px;
    }

    .game-shell::before,
    .game-shell::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      opacity: .6;
      pointer-events: none;
    }

    .game-shell::before {
      width: 260px;
      height: 260px;
      top: -150px;
      left: -80px;
      background: #ffe784;
    }

    .game-shell::after {
      width: 220px;
      height: 220px;
      right: -95px;
      bottom: -95px;
      background: #bcefd0;
    }

    .game-content {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .game-header {
      text-align: center;
      margin: 0 auto 22px;
      max-width: 740px;
      animation: rise-in .6s ease both;
    }

    .unit-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 2px solid #f1bf28;
      box-shadow: 0 3px 0 #e7af15;
      margin-bottom: 10px;
    }

    .title-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .pet-icon {
      font-size: 38px;
      animation: bob 2.2s ease-in-out infinite;
    }

    .instructions {
      margin: 12px auto 0;
      max-width: 590px;
      line-height: 1.5;
    }

    .dashboard-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .progress-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      border: 2px solid #bfdef2;
      padding: 10px 15px;
      border-radius: 16px;
      box-shadow: 0 4px 0 #c7e8f8;
    }

    .progress-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #48b578;
      box-shadow: 0 0 0 4px #dff7e8;
    }

    .game-board {
      position: relative;
      padding: 20px;
      border: 3px solid #b9dff2;
      border-radius: 28px;
      background: rgba(255, 255, 255, .8);
      box-shadow: 0 8px 0 #b9dff2;
      animation: rise-in .75s .12s ease both;
    }

    .line-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      overflow: visible;
    }

    .match-columns {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 112px minmax(0, 1fr);
      position: relative;
      z-index: 3;
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .column-head {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      margin-bottom: 3px;
      border-radius: 14px;
      text-align: center;
    }

    .column-gap { min-width: 112px; }

    .card {
      width: 100%;
      min-height: 88px;
      padding: 11px 15px;
      position: relative;
      border: 3px solid transparent;
      border-radius: 18px;
      cursor: pointer;
      text-align: left;
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .card:focus-visible {
      outline: 4px solid #1c7ee7;
      outline-offset: 3px;
    }

    .english-card {
      background: #fffdf6;
      border-color: #f6dd91;
      box-shadow: 0 5px 0 #edd38b;
      perspective: 900px;
    }

    .meaning-card {
      background: #f7fbff;
      border-color: #b9daf6;
      box-shadow: 0 5px 0 #b2d1ed;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .card:not(.matched):hover {
      transform: translateY(-3px) rotate(-.4deg);
    }

    .card.selected {
      border-color: #ff9b3e;
      box-shadow: 0 0 0 4px #ffe1ae, 0 5px 0 #e6872c;
      transform: translateY(-2px);
    }

    .card.matched {
      cursor: pointer;
      border-color: #54b680;
      box-shadow: 0 4px 0 #328c5c;
    }

    .english-card.matched { background: #effcf3; }
    .meaning-card.matched { background: #ecfbf1; }

    .card-inner {
      position: relative;
      width: 100%;
      min-height: 62px;
      transform-style: preserve-3d;
      transition: transform .5s ease;
    }

    .english-card.flipped .card-inner { transform: rotateY(180deg); }

    .card-face {
      width: 100%;
      min-height: 62px;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
    }

    .card-back {
      position: absolute;
      inset: 0;
      transform: rotateY(180deg);
      display: flex;
      align-items: center;
    }

    .animal-art {
      width: 54px;
      height: 54px;
      flex: 0 0 54px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: #dff5ff;
      font-size: 31px;
      margin-right: 12px;
    }

    .word-block { min-width: 0; }
    .word-block p { margin: 0; }
    .ipa { margin-top: 3px !important; opacity: .72; }

    .details {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2px;
      line-height: 1.25;
    }

    .detail-example {
      margin-top: 2px;
      font-size: .79rem;
      opacity: .84;
      font-style: italic;
    }

    .check-badge {
      position: absolute;
      top: 8px;
      right: 9px;
      display: none;
      width: 23px;
      height: 23px;
      border-radius: 50%;
      align-items: center;
      justify-content: center;
      color: white;
      background: #36a66e;
    }

    .matched .check-badge { display: flex; }

    .correct-pop { animation: correct-pop .48s ease both; }
    .wrong-shake { animation: wrong-shake .42s ease both; }

    .completion {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 14px 18px;
      margin-bottom: 16px;
      border-radius: 17px;
      border: 2px solid #72c894;
      box-shadow: 0 4px 0 #55a977;
      animation: celebrate .5s ease both;
    }

    .completion.show { display: flex; }

    .play-again {
      border: 0;
      padding: 12px 17px;
      border-radius: 14px;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
      box-shadow: 0 4px 0 #de5d4c;
    }

    .play-again:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #de5d4c; }
    .play-again:active { transform: translateY(3px); box-shadow: 0 1px 0 #de5d4c; }
    .play-again:focus-visible { outline: 4px solid #1c7ee7; outline-offset: 3px; }

    .tiny-hint {
      text-align: center;
      margin: 16px 0 0;
    }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes bob {
      0%, 100% { transform: rotate(-5deg) translateY(0); }
      50% { transform: rotate(5deg) translateY(-5px); }
    }
    @keyframes correct-pop {
      0% { transform: scale(1); }
      45% { transform: scale(1.045); }
      100% { transform: scale(1); }
    }
    @keyframes wrong-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      55% { transform: translateX(8px); }
      75% { transform: translateX(-4px); }
    }
    @keyframes celebrate {
      0% { opacity: 0; transform: scale(.92); }
      75% { transform: scale(1.03); }
      100% { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 680px) {
      .game-shell { padding: 20px 12px 30px; }
      .game-board { padding: 13px; border-radius: 22px; }
      .match-columns { grid-template-columns: 1fr; gap: 22px; }
      .column-gap { display: none; }
      .line-layer { display: none; }
      .column-head { min-height: 42px; }
      .card { min-height: 82px; }
      .animal-art { width: 48px; height: 48px; flex-basis: 48px; font-size: 27px; }
      .dashboard-row { justify-content: center; }
      .progress-box { width: 100%; justify-content: center; }
    }
  </style>

  <script src="/_sdk/f344579cd2b2cf70.editing_sdk.js" integrity="sha512-bzdgmfJ/pl/acJqgk+LGvYwJbF03Y2d6f4oZHD96WjqTnvQUZBGVAQkTDRz+fyIMjVc+AXkpwFXqDYLeHDMLSw=="></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();

      const board = document.querySelector(".game-board");
      const lineLayer = document.getElementById("line-layer");
      const englishCards = [...document.querySelectorAll(".english-card")];
      const meaningList = document.getElementById("meaning-list");
      const meaningCards = [...document.querySelectorAll(".meaning-card")];
      const count = document.getElementById("progress-count");
      const completion = document.getElementById("completion-banner");
      const resetButton = document.getElementById("reset-button");

      let selectedEnglish = null;
      let selectedMeaning = null;
      let matchedPairs = new Set();
      let checking = false;

      function shuffleMeanings() {
        const cards = [...meaningList.children];
        for (let i = cards.length - 1; i > 0; i--) {
          const randomIndex = Math.floor(Math.random() * (i + 1));
          [cards[i], cards[randomIndex]] = [cards[randomIndex], cards[i]];
        }
        cards.forEach(card => meaningList.appendChild(card));
      }

      function updateProgress() {
        count.textContent = matchedPairs.size + " / 8";
        if (matchedPairs.size === 8) completion.classList.add("show");
      }

      function clearSelection() {
        if (selectedEnglish) selectedEnglish.classList.remove("selected");
        if (selectedMeaning) selectedMeaning.classList.remove("selected");
        selectedEnglish = null;
        selectedMeaning = null;
      }

      function pointInsideBoard(element, side) {
        const boardRect = board.getBoundingClientRect();
        const rect = element.getBoundingClientRect();
        return {
          x: side === "left" ? rect.right - boardRect.left : rect.left - boardRect.left,
          y: rect.top - boardRect.top + rect.height / 2
        };
      }

      function drawLines() {
        lineLayer.replaceChildren();
        if (window.innerWidth <= 680) return;

        const boardRect = board.getBoundingClientRect();
        lineLayer.setAttribute("viewBox", `0 0 ${boardRect.width} ${boardRect.height}`);

        matchedPairs.forEach(pair => {
          const leftCard = document.querySelector(`.english-card[data-pair="${pair}"]`);
          const rightCard = document.querySelector(`.meaning-card[data-pair="${pair}"]`);
          const start = pointInsideBoard(leftCard, "left");
          const end = pointInsideBoard(rightCard, "right");
          const midX = (start.x + end.x) / 2;

          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          path.setAttribute("d", `M ${start.x} ${start.y} C ${midX} ${start.y}, ${midX} ${end.y}, ${end.x} ${end.y}`);
          path.setAttribute("fill", "none");
          path.setAttribute("stroke", "#43ad73");
          path.setAttribute("stroke-width", "5");
          path.setAttribute("stroke-linecap", "round");
          path.style.filter = "drop-shadow(0 2px 0 rgba(28, 116, 70, .16))";
          lineLayer.appendChild(path);

          [start, end].forEach(point => {
            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("cx", point.x);
            circle.setAttribute("cy", point.y);
            circle.setAttribute("r", "5");
            circle.setAttribute("fill", "#43ad73");
            lineLayer.appendChild(circle);
          });
        });
      }

      function checkMatch() {
        if (!selectedEnglish || !selectedMeaning || checking) return;
        checking = true;

        if (selectedEnglish.dataset.pair === selectedMeaning.dataset.pair) {
          const pair = selectedEnglish.dataset.pair;
          matchedPairs.add(pair);

          [selectedEnglish, selectedMeaning].forEach(card => {
            card.classList.remove("selected");
            card.classList.add("matched", "correct-pop");
            card.setAttribute("aria-pressed", "true");
          });

          selectedEnglish = null;
          selectedMeaning = null;
          updateProgress();

          requestAnimationFrame(drawLines);
          setTimeout(() => {
            document.querySelectorAll(".correct-pop").forEach(card => card.classList.remove("correct-pop"));
            checking = false;
          }, 500);
        } else {
          [selectedEnglish, selectedMeaning].forEach(card => card.classList.add("wrong-shake"));
          setTimeout(() => {
            [selectedEnglish, selectedMeaning].forEach(card => card.classList.remove("wrong-shake"));
            clearSelection();
            checking = false;
          }, 440);
        }
      }

      function chooseEnglish(card) {
        if (checking) return;
        if (card.classList.contains("matched")) {
          card.classList.toggle("flipped");
          card.setAttribute("aria-expanded", String(card.classList.contains("flipped")));
          requestAnimationFrame(drawLines);
          return;
        }
        if (selectedEnglish === card) {
          clearSelection();
          return;
        }
        if (selectedEnglish) selectedEnglish.classList.remove("selected");
        selectedEnglish = card;
        selectedEnglish.classList.add("selected");
        checkMatch();
      }

      function chooseMeaning(card) {
        if (checking) return;
        if (card.classList.contains("matched")) {
          const pair = card.dataset.pair;
          const englishCard = document.querySelector(`.english-card[data-pair="${pair}"]`);
          englishCard.classList.toggle("flipped");
          englishCard.setAttribute("aria-expanded", String(englishCard.classList.contains("flipped")));
          requestAnimationFrame(drawLines);
          return;
        }
        if (selectedMeaning === card) {
          clearSelection();
          return;
        }
        if (selectedMeaning) selectedMeaning.classList.remove("selected");
        selectedMeaning = card;
        selectedMeaning.classList.add("selected");
        checkMatch();
      }

      englishCards.forEach(card => card.addEventListener("click", () => chooseEnglish(card)));
      meaningCards.forEach(card => card.addEventListener("click", () => chooseMeaning(card)));

      resetButton.addEventListener("click", () => {
        checking = false;
        clearSelection();
        matchedPairs.clear();
        completion.classList.remove("show");

        [...document.querySelectorAll(".card")].forEach(card => {
          card.classList.remove("matched", "selected", "flipped", "correct-pop", "wrong-shake");
          card.removeAttribute("aria-pressed");
          card.removeAttribute("aria-expanded");
        });

        shuffleMeanings();
        updateProgress();
        requestAnimationFrame(drawLines);
      });

      window.addEventListener("resize", () => requestAnimationFrame(drawLines));

      shuffleMeanings();
      updateProgress();
    });
  </script>
